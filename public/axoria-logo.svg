<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      /* Styling for the minimalist lines and text */
      .mark { 
        fill: none; 
        stroke: #1a1a24; 
        stroke-width: 20; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
      }
      .arrow {
        fill: none; 
        stroke: #1a1a24; 
        stroke-width: 16; 
        stroke-linecap: round; 
      }
      .arrow-head { 
        fill: none; 
        stroke: #1a1a24; 
        stroke-width: 16; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
      }
      .logo-text { 
        font-family: 'Montserrat', 'Helvetica Neue', system-ui, sans-serif; 
        font-size: 52px; 
        font-weight: 700; 
        letter-spacing: 12px; 
        fill: #1a1a24; 
        text-anchor: middle; 
      }
    </style>
  </defs>

  <!-- The left and right legs of the 'A' -->
  <path d="M 200 90 L 120 250" class="mark"/>
  <path d="M 200 90 L 280 250" class="mark"/>

  <!-- The swooping arrow acting as the crossbar -->
  <path d="M 90 220 Q 200 200 300 150" class="arrow"/>

  <!-- The arrowhead, angled to match the swoop's trajectory -->
  <g transform="translate(300, 150) rotate(-28)">
    <polyline points="-25,-20 0,0 -25,20" class="arrow-head"/>
  </g>

  <!-- The Brand Name (Offset slightly to perfectly center the spaced letters) -->
  <text x="206" y="330" class="logo-text">AXORIA</text>
</svg>
